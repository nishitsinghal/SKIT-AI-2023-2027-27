
name: Generate Final Team Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: pip install pypdf reportlab

      - name: Generate Final PDF
        run: python generate_final_report.py

      - name: Upload Final PDF
        uses: actions/upload-artifact@v4
        with:
          name: Final-Team-Report
          path: weekly_reports/*_Combined_Weekly_Progress_Report_Form-3_*.pdf
          if-no-files-found: error
